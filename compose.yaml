services:
  origin:
    build:
      context: .
      dockerfile: Dockerfile
    image: farsrail.com:latest
    container_name: farsrail-origin
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Canonical host redirection behind Cloudflare
      NGINX_FORCE_DOMAIN: "farsrail.com"
      NGINX_CANONICAL_SCHEME: "https"
      NGINX_FORCE_DOMAIN_STATUS: "308"

      # Cloudflare Real-IP restoration
      NGINX_REAL_IP_HEADER: "CF-Connecting-IP"
      NGINX_TRUSTED_PROXY_CIDRS: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

      # Cloudflare Edge and Browser Cache TTLs
      NGINX_CDN_CACHE_HASHED: "public, max-age=31536000, immutable"
      NGINX_CDN_S_MAXAGE: "31536000"
      NGINX_CDN_CACHE_HTML: "public, max-age=0, must-revalidate"
      NGINX_CDN_HTML_S_MAXAGE: "0"
      NGINX_CDN_CACHE_IMAGE: "public, max-age=0, must-revalidate"
      NGINX_CDN_IMAGE_S_MAXAGE: "86400"
      NGINX_CDN_CACHE_JSON: "public, max-age=60, stale-while-revalidate=30"
      NGINX_CDN_CACHE_SERVICE_WORKER: "no-cache"
      NGINX_CDN_CACHE_ERROR: "no-store"
      NGINX_CDN_CACHE_UNVERSIONED_STATIC: "public, max-age=3600, stale-while-revalidate=30"

      # Feature flags
      NGINX_AUTO_WEBP: "off"
      NGINX_CORS_ENABLE: "off"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/server-info | grep -q 'status=ok' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
